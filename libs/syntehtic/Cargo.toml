[package]
name = "synthetic"
description = "Library to measure synthetic traffic."
version = "0.0.1-dev"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "1.3.3"
bytes = "1.1.0"
serde = {version="1.0.130", features=["derive"]}
serde-big-array = {version = "0.3.2", features = ["const-generics"]}
thiserror = "1.0.30"
tokio = {version = "1.12.0", features = ["full"]}
tokio-stream = "0.1.7"
tokio-util = {version = "0.6.8", features = ["full"]}
tracing = {version = "0.1.29", default-features = false, features = ["attributes"]}
tracing-subscriber = "0.2.25"
