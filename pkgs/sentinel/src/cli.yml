name: sentinel-cli
args:
  - verbose:
      help: Sets the verbosity level
      long: verbose
      short: v
      multiple: true
  - mode:
      help: Sets the mode of the sentinel
      long: mode
      short: m
      possible_values:
        - unavailable
        - unauthenticated
        - authenticated
        - encrypted
      default_value: unauthenticated

subcommands:
  - config:
      about: Configure the sentinel
      long: config
      short: c
      subcommands:
        - set:
            about: Set a configuration value
            long: set
            short: s
            args:
              - key:
                  help: The configuration key
                  long: key
                  short: k
                  required: true
              - value:
                  help: The configuration value
                  long: value
                  short: v
                  required: true
        - get:
            about: Get a configuration value
            long: get
            short: g
            args:
              - key:
                  help: The configuration key
                  long: key
                  short: k
                  required: true
        - list:
            about: List all configuration values
            long: list
            short: l
        - delete:
            about: Delete a configuration value
            long: delete
            short: d
            args:
              - key:
                  help: The configuration key
                  long: key
                  short: k
                  required: true
  - register:
      about: Registers sentinel with mothership
      args:
        - url:
            help: Mothership URL
            long: url
            short: u
            default_value: http://localhost:8000
        - id:
            help: Sentinel ID
            long: id
            short: i
  - serve:
      about: Starts the sentinel as
      args:
        - full:
            help: Serve the sentinel in full mode, [y]es for full, [n]o for standalone
            long: full
            short: f
            possible_values:
              - n # quick run without mothership
              - y # with all the bells and whistles
            default_value: n
  - client:
      about: Create a new test client and runs in standalone mode
      subcommands:
        - standalone:
            about: Creates a new session
            args:
              - destination:
                  help: Destination IP of the session
                  long: destination
                  short: d
              - packet_count:
                  help: Number of packets to send
                  long: count
                  short: c
                  default_value: "1"
              - packet_size:
                  help: Size of each packet to send in bytes
                  long: size
                  short: s
                  default_value: "256"
                  takes_value: true
              - interval:
                  help: Interval between packets in milliseconds
                  long: interval
                  short: i
                  default_value: "0"
                  takes_value: true
