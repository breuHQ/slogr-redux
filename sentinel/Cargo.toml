[package]
name = "sentinel"
description = "Command line interface for the slogr.io sentinel"
version = "0.0.1-dev"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = {version = "2.33.3", features=["yaml"]}
tokio = {version = "1.12.0", features = ["full"]}
tokio-stream = "0.1.7"
tokio-util = {version = "0.6.8", features = ["full"]}
tracing = {version = "0.1.29", default-features = false, features = ["attributes"]}
tracing-subscriber = "0.2.25"
criterion = "0.3"

# sentinel related dependencies
synthetic = { path = "../libs/syntehtic" }
derive_bytes = { path = "../macros/derive_bytes"}



[[bench]]
name = "benchmark"
path = "src/benchmark.rs"
harness = false
